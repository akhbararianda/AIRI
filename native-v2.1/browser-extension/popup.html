<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{width:320px;margin:0;background:#0c1118;color:#edf3fa;font:13px "Segoe UI Variable","Segoe UI",sans-serif}.head{padding:18px 18px 16px;background:linear-gradient(145deg,#131c29,#0d141e);border-bottom:1px solid #263448}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:12px;background:#58a6ff;color:#07111d;display:grid;place-items:center;font-size:20px;font-weight:900;box-shadow:0 8px 24px #0005}.head b{display:block;font-size:16px;letter-spacing:.1px}.sub{margin-top:2px;color:#91a0b4;font-size:11px}.body{padding:16px}.card{background:#151d29;border:1px solid #263448;border-radius:14px;padding:12px 13px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-weight:600}.hint{font-size:11px;color:#91a0b4;margin-top:5px;line-height:1.45}.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#202c3c;border:1px solid #314157;color:#b9c8da}.ok{color:#6fe0a8;border-color:#285d48;background:#143526}.bad{color:#ff9c9c;border-color:#663737;background:#351b1b}button{width:100%;height:38px;border:0;border-radius:11px;background:#58a6ff;color:#07111d;font-weight:750;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.07);transform:translateY(-1px)}input[type=checkbox]{accent-color:#58a6ff;width:17px;height:17px}</style></head><body><div class="head"><div class="brand"><div class="logo">A</div><div><b>AIRI Download Manager</b><div class="sub">Universal Media Integration 3.4</div></div></div></div><div class="body"><div class="card"><div class="row"><span class="label">Monitor browser downloads</span><input id="monitor" type="checkbox"></div><div class="hint">HTTP/HTTPS downloads are handed to AIRI automatically.</div></div><div class="card"><div class="row"><span class="label">Desktop bridge</span><span id="bridge" class="pill">Checking…</span></div><div class="hint">Universal video detection supports ordinary direct media, HLS/DASH fallback and page extraction.</div></div><button id="test">Test AIRI connection</button></div><script src="popup.js"></script></body></html>
