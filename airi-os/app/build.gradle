plugins {
    id 'com.android.application'
}

android {
    namespace 'id.airi.os'
    compileSdk 35

    defaultConfig {
        applicationId 'id.airi.os'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '13.0.0-ai-zero-screen'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
