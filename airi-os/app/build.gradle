plugins {
    id 'com.android.application'
}

android {
    namespace 'id.airi.os'
    compileSdk 35

    defaultConfig {
        applicationId 'id.airi.os'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '7.0.0-true-liquid-android11'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
