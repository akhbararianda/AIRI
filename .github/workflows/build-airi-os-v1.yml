name: Build AIRI OS v18 Ultra Asset Stable APK

on:
  push:
    branches: [airi-os-v18-ultra-asset-stable]
    paths:
      - 'airi-os/**'
      - '.github/workflows/build-airi-os-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate bundled Ultra Asset Pack
        working-directory: airi-os
        run: python3 tools/generate_ultra_assets.py

      - name: Show bundled asset size
        run: du -sh airi-os/app/src/main/assets || true

      - name: Build debug APK
        working-directory: airi-os
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK is larger than 2 MB
        run: |
          APK=airi-os/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          test "$SIZE" -ge 2097152

      - name: Rename APK
        run: cp airi-os/app/build/outputs/apk/debug/app-debug.apk AIRI-OS-v18.0-Ultra-Asset-Stable-RMX1851.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-OS-v18.0-Ultra-Asset-Stable-RMX1851
          path: AIRI-OS-v18.0-Ultra-Asset-Stable-RMX1851.apk
          if-no-files-found: error
          retention-days: 30
