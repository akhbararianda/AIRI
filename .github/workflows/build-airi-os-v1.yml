name: Build AIRI Ultimate Fusion v20 APK

on:
  push:
    branches: [airi-os-v20-ultimate-fusion]
    paths:
      - 'airi-os/**'
      - '.github/workflows/build-airi-os-v1.yml'
  pull_request:
    branches: [airi-os-v20-ultimate-fusion]
    paths:
      - 'airi-os/**'
      - '.github/workflows/build-airi-os-v1.yml'
      - 'airi-os-build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate bundled asset pack
        working-directory: airi-os
        run: python3 tools/generate_ultra_assets.py

      - name: Build debug APK
        working-directory: airi-os
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=airi-os/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Rename APK
        run: cp airi-os/app/build/outputs/apk/debug/app-debug.apk AIRI-Ultimate-Fusion-v20-RMX1851.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Ultimate-Fusion-v20-RMX1851
          path: AIRI-Ultimate-Fusion-v20-RMX1851.apk
          if-no-files-found: error
          retention-days: 30
