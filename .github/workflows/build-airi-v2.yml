name: Build AIRI Download Manager v2.5 Modern

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native-v2.1/**'
      - '.github/workflows/build-airi-v2.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AIRI branding assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $appDir = Join-Path $PWD 'native-v2.1\src\app'
          $extDir = Join-Path $PWD 'native-v2.1\browser-extension\icons'
          New-Item -ItemType Directory -Force $extDir | Out-Null
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $cream = [System.Drawing.Color]::FromArgb(255,248,234)
          $blue = [System.Drawing.Color]::FromArgb(15,76,129)
          $white = [System.Drawing.Color]::White
          $g.Clear($cream)
          $brushBlue = New-Object System.Drawing.SolidBrush($blue)
          $brushWhite = New-Object System.Drawing.SolidBrush($white)
          $g.FillEllipse($brushBlue,18,18,220,220)
          $fontA = New-Object System.Drawing.Font('Segoe UI',92,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $fontD = New-Object System.Drawing.Font('Segoe UI',64,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('A',$fontA,$brushWhite,(New-Object System.Drawing.RectangleF(22,22,150,180)),$sf)
          $g.DrawString([char]0x2193,$fontD,$brushWhite,(New-Object System.Drawing.RectangleF(120,76,110,130)),$sf)
          $hIcon = $bmp.GetHicon(); $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [System.IO.File]::Create((Join-Path $appDir 'airi.ico')); $icon.Save($fs); $fs.Close()
          foreach ($size in 16,32,48,128) {
            $small = New-Object System.Drawing.Bitmap $size,$size
            $sg = [System.Drawing.Graphics]::FromImage($small)
            $sg.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $sg.DrawImage($bmp,0,0,$size,$size)
            $small.Save((Join-Path $extDir ("icon$size.png")),[System.Drawing.Imaging.ImageFormat]::Png)
            $sg.Dispose(); $small.Dispose()
          }
          $icon.Dispose(); $fontA.Dispose(); $fontD.Dispose(); $brushBlue.Dispose(); $brushWhite.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Harden modern dashboard layout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p='native-v2.1\src\app\main_v25.cpp'
          $s=Get-Content $p -Raw
          $s=$s.Replace('#include <chrono>',"#include <chrono>`r`n#include <cwctype>")
          $old='void layout(HWND h){RECT r{};GetClientRect(h,&r);int w=r.right;int top=214;MoveWindow(g_search,24,158,260,36,TRUE);MoveWindow(g_filter,296,158,150,220,TRUE);int bx=w-24;MoveWindow(g_open,bx-112,158,112,36,TRUE);bx-=122;MoveWindow(g_resume_all,bx-112,158,112,36,TRUE);bx-=122;MoveWindow(g_pause_all,bx-112,158,112,36,TRUE);MoveWindow(g_list,24,top,w-48,std::max(120,r.bottom-top-56),TRUE);}'
          $new='void layout(HWND h){RECT r{};GetClientRect(h,&r);int w=(int)r.right;int y=158,top=214;int x=24;MoveWindow(g_search,x,y,220,36,TRUE);x+=232;MoveWindow(g_filter,x,y,132,220,TRUE);x+=144;MoveWindow(g_add,x,y,126,36,TRUE);x+=134;MoveWindow(g_pause,x,y,82,36,TRUE);x+=90;MoveWindow(g_resume,x,y,88,36,TRUE);x+=96;MoveWindow(g_cancel,x,y,82,36,TRUE);x+=90;MoveWindow(g_pause_all,x,y,96,36,TRUE);x+=104;MoveWindow(g_resume_all,x,y,102,36,TRUE);x+=110;MoveWindow(g_open,x,y,108,36,TRUE);MoveWindow(g_list,24,top,std::max(400,w-48),(int)std::max<LONG>(120,r.bottom-top-56),TRUE);}'
          if(-not $s.Contains($old)){throw 'v2.5 layout signature changed'}
          $s=$s.Replace($old,$new)
          $s=$s.Replace('int gap=12,cw=(std::max(900,cr.right)-48-gap*3)/4;','int gap=12,cw=((int)std::max<LONG>(900,cr.right)-48-gap*3)/4;')
          $old2='auto tlen=GetWindowTextLengthW(d->hwndItem);std::wstring t(tlen,L''\0'');GetWindowTextW(d->hwndItem,t.data(),tlen+1);draw_text(d->hDC,t.c_str(),d->rcItem,disabled?RGB(255,255,255):C_MUTED,g_font_bold,DT_CENTER|DT_VCENTER|DT_SINGLELINE);'
          $new2='auto tlen=GetWindowTextLengthW(d->hwndItem);std::vector<wchar_t>tb((std::size_t)tlen+1);GetWindowTextW(d->hwndItem,tb.data(),tlen+1);draw_text(d->hDC,tb.data(),d->rcItem,disabled?RGB(255,255,255):C_MUTED,g_font_bold,DT_CENTER|DT_VCENTER|DT_SINGLELINE);'
          if(-not $s.Contains($old2)){throw 'v2.5 button draw signature changed'}
          $s=$s.Replace($old2,$new2)
          Set-Content $p $s -Encoding UTF8

      - name: Tune media telemetry
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='native-v2.1\src\engine\media_worker.cpp'
          $s=Get-Content $p -Raw
          $needle=' --ignore-config --newline --no-playlist'
          if($s.Contains($needle)){$s=$s.Replace($needle,' --ignore-config --newline --progress-delta 0.5 --concurrent-fragments 8 --no-playlist')}
          Set-Content $p $s -Encoding UTF8

      - name: Verify v2.5 sources
        shell: powershell
        run: |
          if(-not (Test-Path 'native-v2.1\src\app\main_v25.cpp')){throw 'Modern UI source missing'}
          $cm=Get-Content 'native-v2.1\CMakeLists.txt' -Raw
          if(-not $cm.Contains('main_v25.cpp')){throw 'CMake is not using v2.5 UI'}
          $m=Get-Content 'native-v2.1\browser-extension\manifest.json' -Raw | ConvertFrom-Json
          if($m.version -ne '3.4.0'){throw "Unexpected extension version $($m.version)"}
          if(-not (Test-Path 'native-v2.1\browser-extension\universal-overlay.js')){throw 'Universal media overlay missing'}

      - name: Configure x64
        shell: powershell
        run: cmake -S native-v2.1 -B native-v2.1\build-win -A x64

      - name: Build Release
        shell: powershell
        run: cmake --build native-v2.1\build-win --config Release --parallel

      - name: Run core tests
        shell: powershell
        run: ctest --test-dir native-v2.1\build-win -C Release --output-on-failure

      - name: Bundle media engine
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tools=Join-Path $PWD 'native-v2.1\third_party\tools'; New-Item -ItemType Directory -Force $tools | Out-Null
          $yt=Join-Path $tools 'yt-dlp.exe'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp.exe' -OutFile $yt
          $ytHash=(Get-FileHash $yt -Algorithm SHA256).Hash.ToLower()
          if($ytHash -ne '52fe3c26dcf71fbdc85b528589020bb0b8e383155cfa81b64dd447bbe35e24b8'){throw "yt-dlp checksum mismatch: $ytHash"}
          $denoZip=Join-Path $env:RUNNER_TEMP 'deno.zip'; Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-pc-windows-msvc.zip' -OutFile $denoZip
          $denoDir=Join-Path $env:RUNNER_TEMP 'deno'; Expand-Archive $denoZip $denoDir -Force; Copy-Item (Join-Path $denoDir 'deno.exe') (Join-Path $tools 'deno.exe') -Force
          $ffZip=Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'; Invoke-WebRequest -Uri 'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $ffZip
          $ffDir=Join-Path $env:RUNNER_TEMP 'ffmpeg'; Expand-Archive $ffZip $ffDir -Force
          $ffmpeg=Get-ChildItem $ffDir -Filter ffmpeg.exe -Recurse | Select-Object -First 1; $ffprobe=Get-ChildItem $ffDir -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if(-not $ffmpeg -or -not $ffprobe){throw 'FFmpeg tools missing'}
          Copy-Item $ffmpeg.FullName (Join-Path $tools 'ffmpeg.exe') -Force; Copy-Item $ffprobe.FullName (Join-Path $tools 'ffprobe.exe') -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" native-v2.1\installer\AIRI-DM-Native.iss'

      - name: Verify package
        shell: powershell
        run: |
          $setup='native-v2.1\installer\Output\AIRI-Download-Manager-Setup-v2.5.exe'
          $app='native-v2.1\build-win\Release\AIRI Download Manager.exe'
          $bridge='native-v2.1\build-win\Release\AIRIDMBridge.exe'
          foreach($f in @($setup,$app,$bridge)){if(-not(Test-Path $f)){throw "Missing $f"}}
          if((Get-Item $setup).Length -lt 20000000){throw 'Installer unexpectedly small'}

      - name: Create SHA256
        shell: powershell
        run: |
          $files=@('native-v2.1\installer\Output\AIRI-Download-Manager-Setup-v2.5.exe','native-v2.1\build-win\Release\AIRI Download Manager.exe','native-v2.1\build-win\Release\AIRIDMBridge.exe')
          $lines=foreach($f in $files){$h=Get-FileHash $f -Algorithm SHA256; "$($h.Hash.ToLower())  $([IO.Path]::GetFileName($f))"}
          $lines | Set-Content native-v2.1\SHA256SUMS.txt

      - name: Upload AIRI v2.5 Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Download-Manager-v2.5-Modern-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            native-v2.1/installer/Output/AIRI-Download-Manager-Setup-v2.5.exe
            native-v2.1/build-win/Release/AIRI Download Manager.exe
            native-v2.1/build-win/Release/AIRIDMBridge.exe
            native-v2.1/browser-extension/**
            native-v2.1/SHA256SUMS.txt

      - name: Publish AIRI v2.5 Modern release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-modern
          name: AIRI Download Manager v2.5 Modern Smart Dashboard
          prerelease: true
          body: |
            AIRI v2.5 redesigns the native Windows desktop with a modern dark dashboard, live statistic cards, graphical per-download progress bars, realtime speed and ETA, downloaded/total size, search and status filters, pause/resume all controls, universal media capture and the existing Turbo Engine.
          files: |
            native-v2.1/installer/Output/AIRI-Download-Manager-Setup-v2.5.exe
            native-v2.1/build-win/Release/AIRI Download Manager.exe
            native-v2.1/build-win/Release/AIRIDMBridge.exe
            native-v2.1/SHA256SUMS.txt
