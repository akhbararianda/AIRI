name: Fetch APKEditor Tool

on:
  push:
    branches:
      - feat/airi-apk-extractor
    paths:
      - '.github/workflows/fetch-apkeditor.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download APKEditor
        run: |
          curl -L --fail --retry 3 \
            -o APKEditor-1.4.9.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          echo "a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67  APKEditor-1.4.9.jar" | sha256sum -c -

      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: APKEditor-1.4.9
          path: APKEditor-1.4.9.jar
          retention-days: 1
