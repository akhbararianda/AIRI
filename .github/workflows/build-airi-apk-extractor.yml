name: Build AIRI APK Extractor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-tools/airi-apk-extractor/**'
      - '.github/workflows/build-airi-apk-extractor.yml'
  push:
    branches:
      - main
      - 'feat/airi-apk-extractor'
    paths:
      - 'android-tools/airi-apk-extractor/**'
      - '.github/workflows/build-airi-apk-extractor.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-tools/airi-apk-extractor
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-tools/airi-apk-extractor/app/build/outputs/apk/debug/app-debug.apk dist/AIRI-APK-Extractor-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-APK-Extractor
          path: dist/AIRI-APK-Extractor-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
