name: Build AIRI EduAttend APK

on:
  pull_request:
    paths:
      - "apps/edu-attend-honor/**"
      - ".github/workflows/edu-attend-honor-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: apps/edu-attend-honor
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -f apps/edu-attend-honor/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-EduAttend-v2.1-debug-apk
          path: apps/edu-attend-honor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
