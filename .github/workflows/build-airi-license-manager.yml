name: Build AIRI License Manager Admin v1.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'commercial-tools/**'
      - '.github/workflows/build-airi-license-manager.yml'

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install admin build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r commercial-tools\requirements-admin.txt

      - name: Validate admin source
        shell: powershell
        run: |
          python -m py_compile commercial-tools\airi_license_manager.py
          python -m py_compile commercial-tools\generate_license.py
          $s=Get-Content 'commercial-tools\airi_license_manager.py' -Raw
          if(-not $s.Contains('Admin Edition v1.1')){throw 'Admin source is not v1.1'}
          if(-not $s.Contains('licenses.db')){throw 'SQLite license database missing'}
          if(-not $s.Contains('Export CSV')){throw 'History export feature missing'}
          if(-not $s.Contains('EXPECTED_PUBLIC_FINGERPRINT')){throw 'Signing key fingerprint guard missing'}

      - name: Generate AIRI admin icon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $out='commercial-tools\airi-license-manager.ico'
          $bmp=New-Object System.Drawing.Bitmap 256,256
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $cream=[System.Drawing.Color]::FromArgb(255,248,234)
          $blue=[System.Drawing.Color]::FromArgb(15,76,129)
          $white=[System.Drawing.Color]::White
          $g.Clear($cream)
          $bBlue=New-Object System.Drawing.SolidBrush($blue)
          $bWhite=New-Object System.Drawing.SolidBrush($white)
          $g.FillEllipse($bBlue,18,18,220,220)
          $font=New-Object System.Drawing.Font('Segoe UI',76,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $small=New-Object System.Drawing.Font('Segoe UI',32,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $sf=New-Object System.Drawing.StringFormat
          $sf.Alignment=[System.Drawing.StringAlignment]::Center
          $sf.LineAlignment=[System.Drawing.StringAlignment]::Center
          $g.DrawString('A',$font,$bWhite,(New-Object System.Drawing.RectangleF(38,38,120,150)),$sf)
          $g.DrawString('KEY',$small,$bWhite,(New-Object System.Drawing.RectangleF(104,100,122,90)),$sf)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs=[System.IO.File]::Create($out);$ico.Save($fs);$fs.Close()
          $ico.Dispose();$font.Dispose();$small.Dispose();$bBlue.Dispose();$bWhite.Dispose();$g.Dispose();$bmp.Dispose()

      - name: Build AIRI License Manager EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "AIRI-License-Manager-Admin-v1.1" `
            --icon "commercial-tools\airi-license-manager.ico" `
            commercial-tools\airi_license_manager.py

      - name: Verify admin binary
        shell: powershell
        run: |
          $exe='dist\AIRI-License-Manager-Admin-v1.1.exe'
          if(-not(Test-Path $exe)){throw 'AIRI License Manager v1.1 EXE missing'}
          $size=(Get-Item $exe).Length
          if($size -lt 5000000){throw "Admin EXE unexpectedly small: $size bytes"}
          Get-Item $exe | Format-List Name,Length

      - name: Create admin SHA256
        shell: powershell
        run: |
          $h=Get-FileHash 'dist\AIRI-License-Manager-Admin-v1.1.exe' -Algorithm SHA256
          "$($h.Hash.ToLower())  AIRI-License-Manager-Admin-v1.1.exe" | Set-Content dist\SHA256SUMS-AIRI-License-Manager.txt

      - name: Upload AIRI License Manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-License-Manager-Admin-v1.1-Windows
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/AIRI-License-Manager-Admin-v1.1.exe
            dist/SHA256SUMS-AIRI-License-Manager.txt

      - name: Publish AIRI License Manager release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airi-license-manager-v1.1.0
          name: AIRI License Manager — Admin Edition v1.1
          prerelease: true
          body: |
            AIRI Technology internal license administration utility.

            v1.1 adds a local SQLite customer/license database, searchable license history, Copy License Key from history, Load Customer for renewals/reissue, CSV export, and automatic migration of legacy JSON history.

            The AIRI private RSA signing key is intentionally NOT bundled or published. The admin app validates the expected public-key fingerprint before issuing a license.

            Developed by AIRI Technology. Founder: Akhbar Arianda.
          files: |
            dist/AIRI-License-Manager-Admin-v1.1.exe
            dist/SHA256SUMS-AIRI-License-Manager.txt
