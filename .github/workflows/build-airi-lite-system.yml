name: Build AIRI Lite System APK

on:
  push:
    branches: [ "airi-lite-realme3pro-v1" ]
    paths:
      - 'android-lite-system/**'
      - '.github/workflows/build-airi-lite-system.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-lite-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Copy friendly APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk AIRI-Lite-System-Realme3Pro-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AIRI-Lite-System-Realme3Pro-v1.0-APK
          path: android-lite-system/AIRI-Lite-System-Realme3Pro-v1.0.apk
          if-no-files-found: error
