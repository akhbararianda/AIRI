<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AIRI OS 26.6</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:white;background:#11182d}body{background:radial-gradient(circle at 20% 10%,#735cff 0 12%,transparent 34%),radial-gradient(circle at 85% 25%,#42c4ff 0 10%,transparent 32%),radial-gradient(circle at 50% 100%,#ef5ca8 0 13%,transparent 38%),linear-gradient(150deg,#101630,#11182d 55%,#28152f)}.wrap{height:100%;padding:12px 14px 10px;display:flex;flex-direction:column}.status{height:28px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:105px;height:29px;border-radius:20px;background:#050506}.widget{margin-top:10px;padding:15px;border-radius:25px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}.clock{font-size:38px;font-weight:800}.date{font-size:12px;opacity:.8;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px 7px;margin-top:14px;flex:1;align-content:start}.app{text-align:center;font-size:10px}.btn{border:0;background:none;color:white;padding:0;width:100%}.icon{width:min(14.5vw,58px);height:min(14.5vw,58px);border-radius:22%;margin:auto auto 5px;display:grid;place-items:center;font-size:27px;box-shadow:0 7px 15px rgba(0,0,0,.25)}.g{background:linear-gradient(145deg,#67e27d,#16aa4c)}.b{background:linear-gradient(145deg,#77d1ff,#2774ef)}.r{background:linear-gradient(145deg,#ff8392,#e83145)}.w{background:linear-gradient(145deg,#fff,#cfd7e1);color:#20242b}.o{background:linear-gradient(145deg,#ffc567,#ef7d22)}.k{background:linear-gradient(145deg,#3f4249,#07080b)}.p{background:linear-gradient(145deg,#ca8fff,#7837d8)}.y{background:linear-gradient(145deg,#fff17a,#efb71f);color:#2b2300}.dock{height:74px;border-radius:26px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:space-around;padding:8px}.dock .icon{margin:0;width:min(13.7vw,55px);height:min(13.7vw,55px)}.sheet{position:fixed;inset:0;background:rgba(6,9,18,.97);padding:55px 18px 20px;display:none;overflow:auto}.sheet.show{display:block}.close{border:0;border-radius:13px;padding:9px 14px;background:rgba(255,255,255,.15);color:white}.card{margin-top:14px;padding:15px;border-radius:18px;background:rgba(255,255,255,.1)}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#080a11;padding:9px 13px;border-radius:12px;font-size:12px;display:none}@media(max-height:700px){.grid{gap:8px 6px}.widget{padding:11px}.clock{font-size:32px}.dock{height:68px}}
</style></head><body><div class="island"></div><div class="wrap"><div class="status"><span id="st">--:--</span><span>▮▮▮ ◒ 76%</span></div><div class="widget"><div class="clock" id="clock">--:--</div><div class="date" id="date">AIRI OS 26.6 Stable</div></div><div class="grid" id="grid"></div><div class="dock" id="dock"></div></div><div class="sheet" id="settings"><button class="close" onclick="hideSettings()">‹ Home</button><h1>Pengaturan AIRI</h1><div class="card"><b>Launcher utama</b><p>Tekan tombol Home lalu pilih AIRI OS 26.6 dan pilih Selalu.</p></div><div class="card"><b>Mode stabil</b><p>Efek berat dikurangi agar lebih cocok untuk Realme 3 Pro.</p></div><div class="card"><b>Versi</b><p>26.6.4 Stable Native Build</p></div></div><div class="toast" id="toast"></div><script>
(function(){'use strict';var apps=[['Telepon','☎','g','com.android.contacts'],['Pesan','●','g','com.android.mms'],['Kamera','◉','w','com.oppo.camera'],['Foto','✿','w','com.google.android.apps.photos'],['Pengaturan','⚙','w','@settings'],['Chrome','◒','w','com.android.chrome'],['WhatsApp','◔','g','com.whatsapp'],['YouTube','▶','r','com.google.android.youtube'],['Play Store','▷','w','com.android.vending'],['File','▰','b','com.coloros.filemanager'],['Kalkulator','÷','o','com.coloros.calculator'],['Jam','◷','k','com.coloros.alarmclock'],['Kalender','16','w','com.google.android.calendar'],['Catatan','≡','y','com.coloros.note'],['Gmail','✉','b','com.google.android.gm'],['Maps','⌖','p','com.google.android.apps.maps']];var grid=document.getElementById('grid'),dock=document.getElementById('dock'),toast=document.getElementById('toast');function mk(a,name){return '<div class="app"><button class="btn" onclick="launch(\''+a[3]+'\',\''+a[0]+'\')"><span class="icon '+a[2]+'">'+a[1]+'</span>'+(name?'<span>'+a[0]+'</span>':'')+'</button></div>'}grid.innerHTML=apps.slice(0,12).map(a=>mk(a,true)).join('');dock.innerHTML=[apps[0],apps[6],apps[5],apps[2]].map(a=>mk(a,false)).join('');window.launch=function(pkg,title){if(pkg==='@settings'){document.getElementById('settings').classList.add('show');return;}tip('Membuka '+title+'…');location.href='app://'+pkg};window.hideSettings=function(){document.getElementById('settings').classList.remove('show')};function tip(x){toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1200)}function tick(){var d=new Date(),t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);document.getElementById('st').textContent=t;document.getElementById('clock').textContent=t;var ds=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];document.getElementById('date').textContent=ds[d.getDay()]+', '+d.getDate()+' • AIRI OS 26.6'}tick();setInterval(tick,30000)})();
</script></body></html>
